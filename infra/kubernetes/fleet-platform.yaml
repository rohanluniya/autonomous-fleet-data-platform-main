apiVersion: v1
kind: Namespace
metadata:
  name: fleet-platform
  labels:
    app.kubernetes.io/part-of: autonomous-fleet-data-platform
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fleet-platform-config
  namespace: fleet-platform
data:
  FLEET_ENV: "staging"
  FLEET_EXECUTION_PROFILE: "docker"
  FLEET_TRANSPORT_MODE: "kafka"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-0.kafka-headless.fleet-platform.svc.cluster.local:9092"
  ICEBERG_REST_URI: "http://lakekeeper.fleet-platform.svc.cluster.local:8181/catalog"
  ICEBERG_WAREHOUSE: "fleet"
  S3_ENDPOINT_URL: "http://rustfs.fleet-platform.svc.cluster.local:9000"
  OPENLINEAGE_NAMESPACE: "autonomous-fleet-platform"
  FLEET_API_PUBLIC_COARSEN_H3_RES: "6"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleet-api
  namespace: fleet-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fleet-api
  template:
    metadata:
      labels:
        app: fleet-api
        tier: edge
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: fleet-api
          image: ghcr.io/autonomous-fleet-data-platform/fleet-api:0.1.0
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: fleet-platform-config
            - secretRef:
                name: fleet-platform-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: fleet-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flink-taskmanager
  template:
    metadata:
      labels:
        app: flink-taskmanager
        tier: internal
    spec:
      containers:
        - name: taskmanager
          image: flink:2.1.3-scala_2.12-java17
          args: ["taskmanager"]
          ports:
            - containerPort: 9249
              name: prom
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flink-taskmanager-hpa
  namespace: fleet-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: flink-taskmanager
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-internal-data-tier
  namespace: fleet-platform
spec:
  podSelector:
    matchLabels:
      tier: internal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: internal
        - podSelector:
            matchLabels:
              tier: edge
---
apiVersion: v1
kind: Service
metadata:
  name: fleet-api
  namespace: fleet-platform
spec:
  selector:
    app: fleet-api
  ports:
    - port: 80
      targetPort: 8000
      name: http
