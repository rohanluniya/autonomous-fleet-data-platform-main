# Autonomous Fleet Telemetry & Driving Intelligence Platform
# Modular Docker Compose with explicit pinned releases (zero floating 'latest' tags).
# Profiles:
#   core          -> Kafka 4.3.2 (KRaft), Apicurio 3.3.5, RustFS 1.0.6, PostGIS 17, Lakekeeper v0.15.1, Flink 2.1.3, FastAPI
#   analytics     -> Spark 4.1.4, Trino 484, Debezium 3.7.1, Airflow 3.4.0
#   observability -> Prometheus v3.16.0, Grafana 13.0.14, OTel Collector 0.166.0, Marquez 0.51.1
#   full          -> Enables all profiles simultaneously

networks:
  fleet_edge:
    driver: bridge
  fleet_internal:
    driver: bridge
    internal: true

volumes:
  kafka_data:
  rustfs_data:
  postgres_data:
  prometheus_data:
  grafana_data:

services:
  kafka:
    image: apache/kafka:4.3.2
    profiles: ["core", "full"]
    hostname: kafka
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      CLUSTER_ID: "Mk3OEYBSD34-FleetKRaft01"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 8
    deploy:
      resources:
        limits:
          memory: 1536M

  postgres:
    image: imresamu/postgis:17-3.6.1-alpine3.23
    profiles: ["core", "analytics", "observability", "full"]
    hostname: postgres
    networks: [fleet_internal]
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=8"
      - "-c"
      - "max_wal_senders=8"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-fleet_ops}"
      POSTGRES_USER: "${POSTGRES_USER:-fleet_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../pipelines/cdc/01_vehicle_registry.sql:/docker-entrypoint-initdb.d/01_vehicle_registry.sql:ro
      - ../../pipelines/cdc/02_postgis_serving.sql:/docker-entrypoint-initdb.d/02_postgis_serving.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet_admin} -d ${POSTGRES_DB:-fleet_ops}"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1024M

  apicurio-registry:
    image: apicurio/apicurio-registry:3.3.5
    profiles: ["core", "full"]
    hostname: apicurio-registry
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APICURIO_STORAGE_KIND: "sql"
      APICURIO_STORAGE_SQL_KIND: "postgresql"
      APICURIO_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB:-fleet_ops}"
      APICURIO_DATASOURCE_USERNAME: "${POSTGRES_USER:-fleet_admin}"
      APICURIO_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 768M

  rustfs:
    image: rustfs/rustfs:1.0.6
    profiles: ["core", "analytics", "full"]
    hostname: rustfs
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: "${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID in .env}"
      RUSTFS_SECRET_KEY: "${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY in .env}"
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.15.1
    profiles: ["core", "analytics", "full"]
    hostname: lakekeeper
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:8181:8181"
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      LAKEKEEPER__PG_DATABASE_URL_READ: "postgresql://${POSTGRES_USER:-fleet_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fleet_ops}"
      LAKEKEEPER__PG_DATABASE_URL_WRITE: "postgresql://${POSTGRES_USER:-fleet_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-fleet_ops}"
      LAKEKEEPER__PG_ENCRYPTION_KEY: "${LAKEKEEPER_ENCRYPTION_KEY:-dev-change-me-32-byte-secret-key}"
      LAKEKEEPER__LISTEN_PORT: "8181"
    command: ["serve"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8181/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  flink-jobmanager:
    image: flink:2.1.3-scala_2.12-java17
    profiles: ["core", "full"]
    hostname: flink-jobmanager
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:8082:8081"
    command: ["jobmanager"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.backend.type: rocksdb
        state.checkpoints.dir: s3://fleet-lakehouse/checkpoints/flink
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ../../services/stream-processing:/opt/flink/jobs:ro
    deploy:
      resources:
        limits:
          memory: 1536M

  flink-taskmanager:
    image: flink:2.1.3-scala_2.12-java17
    profiles: ["core", "full"]
    networks: [fleet_internal]
    command: ["taskmanager"]
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend.type: rocksdb
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    volumes:
      - ../../services/stream-processing:/opt/flink/jobs:ro
    deploy:
      resources:
        limits:
          memory: 2048M

  spark-master:
    image: apache/spark:4.1.4-scala2.13-java17-python3-ubuntu
    profiles: ["analytics", "full"]
    hostname: spark-master
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:8083:8080"
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    depends_on:
      lakekeeper:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    environment:
      ICEBERG_REST_URI: "http://lakekeeper:8181/catalog"
      ICEBERG_WAREHOUSE: "fleet"
      S3_ENDPOINT_URL: "http://rustfs:9000"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      OPENLINEAGE_URL: "http://marquez:5000"
    volumes:
      - ../../pipelines/spark:/opt/fleet/pipelines/spark:ro
    deploy:
      resources:
        limits:
          memory: 2048M

  trino:
    image: trinodb/trino:484
    profiles: ["analytics", "full"]
    hostname: trino
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      lakekeeper:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 15s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 2048M

  debezium-connect:
    image: quay.io/debezium/connect:3.7.1.Final
    profiles: ["analytics", "full"]
    hostname: debezium-connect
    networks: [fleet_internal]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: "kafka:9092"
      GROUP_ID: "fleet-debezium-connect"
      CONFIG_STORAGE_TOPIC: "fleet.connect.configs"
      OFFSET_STORAGE_TOPIC: "fleet.connect.offsets"
      STATUS_STORAGE_TOPIC: "fleet.connect.status"
    deploy:
      resources:
        limits:
          memory: 1024M

  airflow:
    image: apache/airflow:slim-3.4.0-python3.12
    profiles: ["analytics", "full"]
    hostname: airflow
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:8088:8080"
    command: ["standalone"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez:5000"}'
      AIRFLOW__OPENLINEAGE__NAMESPACE: "autonomous-fleet-platform"
    volumes:
      - ../../pipelines/airflow/dags:/opt/airflow/dags:ro
    deploy:
      resources:
        limits:
          memory: 1536M

  fleet-api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.python
    profiles: ["core", "full"]
    hostname: fleet-api
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      FLEET_ENV: "${FLEET_ENV:-dev}"
      FLEET_EXECUTION_PROFILE: "docker"
      FLEET_TRANSPORT_MODE: "kafka"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      ICEBERG_REST_URI: "http://lakekeeper:8181/catalog"
      S3_ENDPOINT_URL: "http://rustfs:9000"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY}"
      FLEET_API_ADMIN_TOKEN: "${FLEET_API_ADMIN_TOKEN}"
      FLEET_API_OPERATOR_TOKEN: "${FLEET_API_OPERATOR_TOKEN}"
      FLEET_API_ANALYST_TOKEN: "${FLEET_API_ANALYST_TOKEN}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 1024M

  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: ["observability", "full"]
    hostname: prometheus
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana:13.0.14
    profiles: ["observability", "full"]
    hostname: grafana
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    deploy:
      resources:
        limits:
          memory: 512M

  otel-collector:
    image: "otel/opentelemetry-collector-contrib:0.166.0-${OTEL_ARCH:-arm64}"
    profiles: ["observability", "full"]
    hostname: otel-collector
    networks: [fleet_internal]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    deploy:
      resources:
        limits:
          memory: 384M

  marquez:
    image: marquezproject/marquez:0.51.1
    platform: linux/amd64
    profiles: ["observability", "full"]
    hostname: marquez
    networks: [fleet_internal, fleet_edge]
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-fleet_ops}"
      POSTGRES_USER: "${POSTGRES_USER:-fleet_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    deploy:
      resources:
        limits:
          memory: 768M
